[project]
name = "ai-initiatives"
version = "0.1.0"
description = "Practical AI engineering: RAG, agents, evals, production serving"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 2.x is httpx2-based and has the beta `fallbacks` parameter aicore uses.
    "anthropic>=2.9,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "numpy>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "voyageai>=0.3",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Installed later, in the RAG phase. Kept out of the base install so the
# first-run experience stays fast and small.
vectordb = [
    "chromadb>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "ipykernel>=6.29",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
